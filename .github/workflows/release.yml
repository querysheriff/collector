name: release

# Run this workflow whenever a Git tag starting with "v" is pushed.
# Example: v0.0.10
on:
  push:
    tags: ['v*']

# Allow this workflow to:
# - create GitHub Releases
# - push Docker images to GitHub Container Registry (GHCR)
permissions:
  contents: write
  packages: write

jobs:
  # Build the Debian package and publish a GitHub Release.
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the exact commit/tag that triggered this workflow.
      - uses: actions/checkout@v7

      # Install the Go version used to build the project.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'

      # Build the .deb package.
      # GITHUB_REF_NAME is e.g. "v0.0.10"; ${...#v} removes the leading "v".
      - name: Build .deb packages
        run: make deb VERSION="${GITHUB_REF_NAME#v}"

      # Create the GitHub Release for the pushed tag and attach the .deb files.
      # --generate-notes creates release notes automatically.
      # --verify-tag makes sure the tag already exists.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb --generate-notes --verify-tag

  # Build and publish the Docker image to GitHub Container Registry.
  image:
    runs-on: ubuntu-latest
    steps:
      # Check out the same tagged source code.
      - uses: actions/checkout@v7

      # Log in to GitHub Container Registry (ghcr.io).
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert the Git tag into Docker image tags.
      # Example: v0.0.10 -> ghcr.io/querysheriff/collector:0.0.10
      # metadata-action also adds :latest for normal SemVer releases.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/querysheriff/collector
          tags: |
            type=semver,pattern={{version}}

      # Build the Docker image for Linux amd64 and push it to GHCR.
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
