name: querysheriff-collector
arch: ${ARCH}
version: ${VERSION}
section: database
priority: optional
maintainer: querysheriff <vladimir.kulikov@cdn77.com>
description: PostgreSQL performance monitoring agent — samples stats views, tails jsonlog, and ships to the querysheriff backend.
homepage: https://github.com/querysheriff/collector
license: Proprietary

depends:
  - adduser # system user/group creation in the postinst.
  - tzdata  # the collector loads the server's log_timezone at runtime (/usr/share/zoneinfo).

contents:
  - src: dist/querysheriff-collector-linux-amd64
    dst: /usr/bin/querysheriff-collector
    file_info:
      mode: 0755

  - src: packaging/debian/querysheriff-collector.service
    dst: /lib/systemd/system/querysheriff-collector.service
    file_info:
      mode: 0644

  - src: packaging/querysheriff-collector.yml.example
    dst: /etc/querysheriff-collector.yml.example
    type: config
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/debian/postinst.sh
  preremove: packaging/debian/prerm.sh
  postremove: packaging/debian/postrm.sh
